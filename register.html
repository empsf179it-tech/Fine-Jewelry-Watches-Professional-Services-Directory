<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Fine & Time</title>
  <meta name="description" content="Register an account on Fine & Time to save professionals, manage enquiries, or submit your own professional listing.">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>


  <!-- Register Form -->
  <div class="auth-wrapper">
    <div class="auth-box" style="max-width: 600px;">
      <div style="text-align: center; margin-bottom: 32px;">
        <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 24px; text-decoration: none;">
  <img src="logo.png" alt="Fine Jewelry & Watches Directory" class="brand-logo-img">
  <div class="logo-text">
    <span class="logo-title">FINE & TIME</span>
    <span class="logo-desc">Professional Directory</span>
  </div>
</a>
        <h1>CREATE ACCOUNT</h1>
        <p style="color: var(--text-secondary);">Join the premier fine jewelry and luxury watch directory.</p>
      </div>

      <form id="register-form">
        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" class="form-control" required placeholder="John Doe">
          </div>
          <div class="form-group">
            <label>Account Type</label>
            <select class="form-control" required>
              <option value="customer">Customer</option>
              <option value="professional">Professional / Specialist</option>
              <option value="business">Business / Retailer</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" class="form-control" required placeholder="name@example.com">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" class="form-control" required placeholder="+1 (555) 000-0000">
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="password-wrap">
            <input type="password" class="form-control" id="reg-pwd" required placeholder="••••••••">
            <button type="button" class="password-toggle">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <div style="height: 4px; background: #e0e0e0; margin-top: 8px; border-radius: 2px; overflow: hidden;">
            <div id="pwd-strength" style="height: 100%; width: 0%; transition: all 0.3s;"></div>
          </div>
          <p style="font-size: 11px; color: var(--text-secondary); margin-top: 4px;" id="pwd-text">Password strength</p>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <div class="password-wrap">
            <input type="password" class="form-control" id="reg-pwd-confirm" required placeholder="••••••••">
            <button type="button" class="password-toggle">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <p style="font-size: 12px; color: #d32f2f; margin-top: 4px; display: none;" id="pwd-match-error">Passwords do not match.</p>
        </div>

        <div class="form-group" style="display: flex; align-items: flex-start; gap: 8px; margin-top: 24px;">
          <input type="checkbox" id="terms" required style="accent-color: var(--accent-color); margin-top: 4px;">
          <label for="terms" style="margin-bottom: 0; text-transform: none; font-weight: 400; font-size: 13px; line-height: 1.5; color: var(--text-secondary);">
            I accept the <a href="#" style="color: var(--text-primary); text-decoration: underline;">Terms of Service</a> and <a href="#" style="color: var(--text-primary); text-decoration: underline;">Privacy Policy</a>, and consent to having my data processed according to the platform guidelines.
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px;">CREATE ACCOUNT</button>
        
        <div style="display: flex; align-items: center; margin: 24px 0;">
          <hr style="flex: 1; border: none; border-top: 1px solid var(--border-color);">
          <span style="padding: 0 16px; color: var(--text-secondary); font-size: 12px; text-transform: uppercase;">or continue with</span>
          <hr style="flex: 1; border: none; border-top: 1px solid var(--border-color);">
        </div>
        
        <div class="auth-social-buttons">
          <button type="button" class="btn btn-outline" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google
          </button>
          <button type="button" class="btn btn-outline" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M17.05 20.28c-.98.68-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 13.25 3.51 5.98 9.05 5.7c1.3.06 2.22.61 2.96.61.7 0 1.94-.68 3.42-.58 1.54.12 2.65.65 3.43 1.56-2.92 1.6-2.45 5.51.52 6.64-1.01 2.53-2.31 5.17-2.33 6.35zm-2.43-16.71c.7-1.35.43-2.97-.67-4.04-1.28-1.21-2.94-1.33-4.03-.31-.83.77-1.41 2.39-.75 3.86.86 1.55 2.68 1.92 3.9 1.1 1.05-.72 1.15-1.57 1.55-2.61z"/>
            </svg>
            Apple
          </button>
        </div>
        
        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // Password Strength Indicator
    const pwdInput = document.getElementById('reg-pwd');
    const pwdStrength = document.getElementById('pwd-strength');
    const pwdText = document.getElementById('pwd-text');

    pwdInput.addEventListener('input', () => {
      const val = pwdInput.value;
      let strength = 0;
      if (val.length > 5) strength += 25;
      if (val.match(/[a-z]+/)) strength += 25;
      if (val.match(/[A-Z]+/)) strength += 25;
      if (val.match(/[0-9]+/) || val.match(/[$@#&!]+/)) strength += 25;

      pwdStrength.style.width = strength + '%';
      
      if (strength === 0) {
        pwdStrength.style.background = 'transparent';
        pwdText.innerText = 'Password strength';
      } else if (strength <= 25) {
        pwdStrength.style.background = '#d32f2f';
        pwdText.innerText = 'Weak';
      } else if (strength <= 50) {
        pwdStrength.style.background = '#f57c00';
        pwdText.innerText = 'Fair';
      } else if (strength <= 75) {
        pwdStrength.style.background = '#fbc02d';
        pwdText.innerText = 'Good';
      } else {
        pwdStrength.style.background = '#388e3c';
        pwdText.innerText = 'Strong';
      }
    });

    // Form Submit
    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const pwd = document.getElementById('reg-pwd').value;
      const confirm = document.getElementById('reg-pwd-confirm').value;
      const errorMsg = document.getElementById('pwd-match-error');
      
      if (pwd !== confirm) {
        errorMsg.style.display = 'block';
        return;
      }
      errorMsg.style.display = 'none';

      const btn = e.target.querySelector('button[type="submit"]');
      btn.innerText = 'CREATING ACCOUNT...';
      
      // Simulate network request
      setTimeout(() => {
        btn.innerText = 'ACCOUNT CREATED';
        btn.classList.add('btn-accent');
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      }, 1500);
    });
  </script>
  <!-- Scroll to Top Button -->
  <button id="scroll-to-top" class="scroll-to-top" aria-label="Scroll to top">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
  </button>
</body>
</html>
